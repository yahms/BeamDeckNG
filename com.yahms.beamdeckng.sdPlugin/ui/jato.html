<!doctype html>
<html>
	<head lang="en">
		<title>JATO</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Button">
			<sdpi-select setting="press" default="hold">
				<option value="hold">Fire while held</option>
				<option value="toggle">Toggle on / off</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="In-game message">
			<sdpi-checkbox setting="msg" default="true" label="show what happened when pressed"></sdpi-checkbox>
		</sdpi-item>
	</body>
</html>
