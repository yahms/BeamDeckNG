<!doctype html>
<html>
	<head lang="en">
		<title>World</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Function">
			<sdpi-select setting="fn" default="clock">
				<optgroup label="Time of day">
					<option value="clock">Clock (press: run / freeze time)</option>
					<option value="time_sunrise">Sunrise 06:00</option>
					<option value="time_noon">Noon 12:00</option>
					<option value="time_sunset">Sunset 18:00</option>
					<option value="time_midnight">Midnight 00:00</option>
					<option value="time_fwd">Time +1 hour</option>
					<option value="time_back">Time -1 hour</option>
					<option value="daylen">Day length (cycle)</option>
				</optgroup>
				<optgroup label="Weather">
					<option value="wx_cycle">Weather (cycle)</option>
					<option value="wx_clear">Clear</option>
					<option value="wx_cloudy">Cloudy</option>
					<option value="wx_fog">Fog</option>
					<option value="wx_rain">Rain</option>
					<option value="wx_storm">Storm</option>
					<option value="rain">Rain only: off / light / heavy</option>
					<option value="fog">Fog only: off / light / heavy</option>
					<option value="wind">Wind: calm / breezy / storm</option>
				</optgroup>
				<optgroup label="Gravity">
					<option value="grav_cycle">Gravity (cycle)</option>
					<option value="grav_earth">Earth</option>
					<option value="grav_moon">Moon</option>
					<option value="grav_mars">Mars</option>
					<option value="grav_zero">Zero-G</option>
				</optgroup>
			</sdpi-select>
		</sdpi-item>
		<p style="color:#aaa;font-size:12px;margin:8px">Needs a loaded map. Preset keys light up green when that preset is the current one, however it was set.</p>
	</body>
</html>
