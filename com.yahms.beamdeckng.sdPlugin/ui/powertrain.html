<!doctype html>
<html>
	<head lang="en">
		<title>Powertrain</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Game bar button">
			<sdpi-select setting="index" default="1">
				<option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option>
				<option value="4">4th</option><option value="5">5th</option><option value="6">6th</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="In-game message">
			<sdpi-checkbox setting="msg" default="true" label="show what happened when pressed"></sdpi-checkbox>
		</sdpi-item>
	</body>
</html>
