<!doctype html>
<html>
	<head lang="en">
		<title>Ignition</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Show">
			<sdpi-select setting="show" default="ignition">
				<option value="ignition">Ignition state (OFF / ACC / RUN / STALL)</option>
				<option value="engine">Engine: gear and RPM, with shift light</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="In-game message">
			<sdpi-checkbox setting="msg" default="true" label="show what happened when pressed"></sdpi-checkbox>
		</sdpi-item>
	</body>
</html>
