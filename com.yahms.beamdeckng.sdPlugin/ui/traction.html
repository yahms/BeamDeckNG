<!doctype html>
<html>
	<head lang="en">
		<title>Traction control</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="On press">
			<sdpi-select setting="press" default="cycle">
				<option value="cycle">Cycle drive modes (Comfort, Sport, ESC &amp; TC Off...)</option>
				<option value="toggle">Toggle TC on / off only</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="In-game message">
			<sdpi-checkbox setting="msg" default="true" label="show what happened when pressed"></sdpi-checkbox>
		</sdpi-item>
	</body>
</html>
