<!doctype html>
<html>
	<head lang="en">
		<title>Indicator</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Side">
			<sdpi-select setting="side" default="left">
				<option value="left">Left</option>
				<option value="right">Right</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="In-game message">
			<sdpi-checkbox setting="msg" default="true" label="show what happened when pressed"></sdpi-checkbox>
		</sdpi-item>
	</body>
</html>
