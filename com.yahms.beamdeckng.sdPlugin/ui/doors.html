<!doctype html>
<html>
	<head lang="en">
		<title>Doors</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Controls">
			<sdpi-select setting="part" default="doors">
				<option value="doors">All doors</option>
				<option value="FL">Front left door</option>
				<option value="FR">Front right door</option>
				<option value="RL">Rear left door</option>
				<option value="RR">Rear right door</option>
				<option value="hood">Bonnet</option>
				<option value="trunk">Boot / tailgate</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="In-game message">
			<sdpi-checkbox setting="msg" default="true" label="show what happened when pressed"></sdpi-checkbox>
		</sdpi-item>
	</body>
</html>
