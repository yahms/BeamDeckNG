<!doctype html>
<html>
	<head lang="en">
		<title>Game function</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Function">
			<sdpi-select setting="fn" default="pause">
				<optgroup label="Fixed buttons">
					<option value="accept">Accept</option>
					<option value="back">Back</option>
					<option value="pause">Pause</option>
					<option value="repair">Repair</option>
					<option value="recover">Recover</option>
					<option value="respawn">Respawn</option>
				</optgroup>
				<optgroup label="Game">
					<option value="walk">Get in / out</option>
					<option value="map">Map</option>
					<option value="vehicles">Vehicles</option>
					<option value="radial">Radial menu</option>
					<option value="slowmo">Slow motion</option>
					<option value="slower">Slower</option>
					<option value="faster">Faster</option>
					<option value="ui">Game UI</option>
					<option value="photo">Photo mode</option>
					<option value="traffic">Traffic</option>
					<option value="trailer">Trailer</option>
					<option value="nextveh">Next vehicle</option>
				</optgroup>
				<optgroup label="Menu navigation">
					<option value="up">Up</option>
					<option value="down">Down</option>
					<option value="left">Left</option>
					<option value="right">Right</option>
				</optgroup>
				<optgroup label="Camera">
					<option value="cam_cycle">Camera</option>
					<option value="cam_center">Centre cam</option>
					<option value="cam_orbit">Orbit</option>
					<option value="cam_driver">Driver</option>
					<option value="cam_chase">Chase</option>
					<option value="cam_external">External</option>
					<option value="cam_top">Top</option>
					<option value="look_back">Look back</option>
					<option value="replay">Replay</option>
				</optgroup>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
