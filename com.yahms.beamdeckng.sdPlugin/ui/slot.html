<!doctype html>
<html>
	<head lang="en">
		<title>Slot</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Position">
			<sdpi-select setting="slot" default="1"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Shows">
			<sdpi-select setting="pin" default="">
				<option value="">The tab picked by the Tab buttons</option>
				<option value="car">Always the Car tab</option>
				<option value="game">Always the Game tab</option>
				<option value="camera">Always the Camera tab</option>
			</sdpi-select>
		</sdpi-item>
		<p style="color:#aaa;font-size:12px;margin:8px">Slots are filled in position order with only what the current vehicle has. Use "Always the ... tab" when you give each tab its own Stream Deck page; the rest of that page is free for other plugins and hotkeys.</p>
	</body>
</html>
